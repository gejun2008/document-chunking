[project]
name = "doc-chunking"
version = "0.1.0"
description = "Document chunking strategies (fixed-size, layout-aware, semantic, context-enriched) with a public-benchmark comparison"
readme = "README.md"
authors = [
    { email = "gejun2008@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "numpy>=2.5.4",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
chonkie = [
    "chonkie>=1.7.0",
]
langchain = [
    "langchain-text-splitters>=1.1.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
bench = [
    "mlx-lm>=0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "sentence-transformers>=6.1.0",
]
dev = [
    "pytest>=9.1.1",
]
